apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{name}}
  labels:
    app: {{name}}
    managed-by: kubernal-idp
spec:
  replicas: {{replicas}}
  selector:
    matchLabels:
      app: {{name}}
  template:
    metadata:
      labels:
        app: {{name}}
        managed-by: kubernal-idp
    spec:
      containers:
        - name: {{name}}
          image: "{{`{{ .Values.image.repository }}`}}:{{`{{ .Values.image.tag }}`}}"
          imagePullPolicy: {{`{{ .Values.image.pullPolicy }}`}}
          ports:
            - containerPort: {{port}}
              protocol: TCP
          env:
            - name: PORT
              value: "{{port}}"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "{{`{{ .Values.resources.requests.cpu }}`}}"
              memory: "{{`{{ .Values.resources.requests.memory }}`}}"
            limits:
              cpu: "{{`{{ .Values.resources.limits.cpu }}`}}"
              memory: "{{`{{ .Values.resources.limits.memory }}`}}"
