apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: kubernal-idp
  description: Internal Developer Platform – Self-service application platform
  tags:
    - idp
    - platform
    - kubernetes
  links:
    - url: https://github.com/Gowaru/kubernal
      title: GitHub Repository
    - url: http://localhost:4000/api/v1/health
      title: API Health
    - url: http://localhost:4000/api/v1/docs/
      title: API Documentation
spec:
  owner: platform-team
  domain: platform

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubernal-api
  description: Kubernal IDP Orchestrator API – Express + Prisma + PostgreSQL
  tags:
    - api
    - nodejs
    - express
    - prisma
    - postgresql
  annotations:
    github.com/project-slug: Gowaru/kubernal
    backstage.io/techdocs-ref: dir:.
    backstage.io/view-url: https://github.com/Gowaru/kubernal/tree/main/apps/api
  links:
    - url: http://localhost:4000/api/v1/docs/
      title: Swagger UI
    - url: http://localhost:4000/api/v1/health
      title: Health Check
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: kubernal-idp
  providesApis:
    - kubernal-api
  dependsOn:
    - resource:kubernal-database
    - resource:kubernal-cluster

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubernal-backstage
  description: Kubernal IDP Developer Portal – Backstage frontend
  tags:
    - backstage
    - portal
    - react
  annotations:
    github.com/project-slug: Gowaru/kubernal
  links:
    - url: http://localhost:7007
      title: Backstage Portal
spec:
  type: website
  lifecycle: production
  owner: platform-team
  system: kubernal-idp

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: kubernal-api
  description: Kubernal IDP REST API – Full OpenAPI 3.1 specification
  tags:
    - rest
    - api
    - openapi
    - express
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: kubernal-idp
  definition:
    $text: https://raw.githubusercontent.com/Gowaru/kubernal/main/apps/api/src/shared/openapi.json

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kubernal-database
  description: PostgreSQL database for Kubernal IDP
  tags:
    - postgresql
    - database
spec:
  type: database
  owner: platform-team
  system: kubernal-idp
  dependsOn:
    - resource:kubernal-cluster

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kubernal-cluster
  description: Kubernetes cluster hosting the IDP platform
  tags:
    - kubernetes
    - cluster
    - kind
spec:
  type: kubernetes-cluster
  owner: platform-team
  system: kubernal-idp

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Platform engineering team
  tags:
    - team
    - platform
spec:
  type: team
  profile:
    displayName: Platform Team
    email: platform@kubernal.io
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: admin
  annotations:
    kubernal.io/role: platform_engineer
spec:
  profile:
    displayName: Platform Admin
    email: admin@kubernal.io
  memberOf:
    - platform-team

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: developer-1
spec:
  profile:
    displayName: Developer
    email: developer@kubernal.io
  memberOf:
    - platform-team
