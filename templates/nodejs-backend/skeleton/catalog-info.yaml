apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.serviceName }}
  description: ${{ values.description }}
  tags: [nodejs, backend, service]
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: kubernal-idp
  dependsOn:
    - resource:kubernal-database
