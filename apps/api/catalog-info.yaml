# =============================================================================
# API Component – Backstage Catalog
# =============================================================================

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubernal-api
  description: Kubernal IDP Orchestrator API (Express + Prisma + PostgreSQL)
  tags:
    - api
    - nodejs
    - express
    - prisma
    - postgresql
  annotations:
    github.com/project-slug: ${GITHUB_REPO_SLUG}
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: development
  owner: platform-team
  system: kubernal-idp
  dependsOn:
    - resource:kubernal-database
  providesApis:
    - kubernal-api

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kubernal-database
  description: PostgreSQL database for Kubernal IDP
  tags:
    - postgresql
    - database
spec:
  type: database
  owner: platform-team
  system: kubernal-idp
