apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-backend-service
  title: Node.js Backend Service
  description: Create a new Node.js + Express backend service with PostgreSQL, Prisma, and OpenTelemetry instrumentation
  tags:
    - nodejs
    - express
    - backend
    - postgresql
    - prisma
    - kubernetes
spec:
  owner: platform-team
  type: service
  system: kubernal-idp

  parameters:
    - title: Service Details
      required:
        - serviceName
        - description
      properties:
        serviceName:
          title: Service Name
          type: string
          description: Unique name for your service
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: A short description of your service
        owner:
          title: Owner
          type: string
          description: Team that owns this service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Deployment
      properties:
        enableProdDeployment:
          title: Enable production deployment
          type: boolean
          default: true
        prodApprovalRequired:
          title: Require approval for production
          type: boolean
          default: true

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: create-application
      name: Register in Kubernal IDP
      action: kubernal:create-application
      input:
        name: ${{ parameters.serviceName }}
        description: ${{ parameters.description }}
        owner: ${{ parameters.owner }}

    - id: create-dev-environment
      name: Create dev environment
      action: kubernal:create-environment
      input:
        applicationName: ${{ parameters.serviceName }}
        environmentType: dev
        namespace: ${{ parameters.serviceName }}-dev

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: View in Kubernal
        url: http://localhost:7007/catalog/default/component/${{ parameters.serviceName }}
