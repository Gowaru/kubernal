# =============================================================================
# Kubernal IDP – Backstage App Configuration
# =============================================================================

app:
  title: Kubernal IDP
  baseUrl: http://localhost:7007

organization:
  name: Kubernal

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:4000
    methods: [GET, POST, PUT, DELETE, PATCH]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST:-localhost}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER:-kubernal}
      password: ${POSTGRES_PASSWORD:-<PLACEHOLDER_DB_PASSWORD>}
      database: ${POSTGRES_DB:-kubernal_backstage}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: local
  generators:
    techdocs: docker

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Group, User, Resource, Location]
  locations:
    - type: file
      target: ../../catalog-info.yaml

    - type: file
      name: kubernal-api-components
      target: ../../apps/api/catalog-info.yaml

    - type: file
      name: kubernal-templates
      target: ../../templates/all.yaml

kubernal:
  api:
    baseUrl: http://localhost:4000/api/v1
  environments:
    - name: dev
      requiresApproval: false
    - name: staging
      requiresApproval: true
    - name: prod
      requiresApproval: true
