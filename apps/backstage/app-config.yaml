app:
  title: Kubernal IDP
  baseUrl: http://localhost:3000
  packages: all

organization:
  name: Kubernal

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST:-localhost}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER:-kubernal}
      password: ${POSTGRES_PASSWORD:-kubernal_dev}
      database: ${POSTGRES_DB:-kubernal_backstage}
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local

auth:
  providers:
    guest: {}

scaffolder:
  actions:
    - name: kubernal:create-deployment
      description: Create a deployment in Kubernal IDP
      input:
        type: object
        properties:
          applicationId:
            type: string
            description: Application ID
          environmentId:
            type: string
            description: Environment ID
          version:
            type: string
            description: Version to deploy
          commitSha:
            type: string
            description: Commit SHA

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    - type: file
      target: ../../../../catalog-info.yaml

    - type: file
      name: kubernal-templates
      target: ../../../../templates/all.yaml
      rules:
        - allow: [Template]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernal-control-plane:6443
          name: kubernal
          authProvider: serviceAccount
          skipTLSVerify: true

kubernal:
  api:
    baseUrl: http://localhost:4000/api/v1
  environments:
    - name: dev
      requiresApproval: false
    - name: staging
      requiresApproval: true
    - name: prod
      requiresApproval: true

proxy:
  endpoints:
    '/kubernal/api':
      target: http://localhost:4000/api/v1
      changeOrigin: true

permission:
  enabled: true
