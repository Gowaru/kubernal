apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernal-prod

resources:
  - ../../k8s/

images:
  - name: ghcr.io/gowaru/kubernal-api
    newTag: latest
  - name: ghcr.io/gowaru/kubernal-backstage
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
  - target:
      kind: Deployment
      name: backstage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.prod.kubernal.local
  - target:
      kind: Ingress
      name: backstage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: backstage.prod.kubernal.local
