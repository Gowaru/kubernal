apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernal-staging

resources:
  - ../../k8s/

images:
  - name: ghcr.io/gowaru/kubernal-api
    newTag: latest
  - name: ghcr.io/gowaru/kubernal-backstage
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: backstage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.kubernal.local
  - target:
      kind: ConfigMap
      name: kubernal-api-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubernal-api-config
      data:
        PORTAL_URL: 'https://backstage.staging.kubernal.local'
  - target:
      kind: Ingress
      name: backstage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: backstage.staging.kubernal.local
