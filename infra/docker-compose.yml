version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kubernal-postgres
    environment:
      POSTGRES_USER: kubernal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kubernal_idp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kubernal -d kubernal_idp']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubernal-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: kubernal-pg-exporter
    environment:
      DATA_SOURCE_USER: kubernal
      DATA_SOURCE_PASS: ${DB_PASSWORD}
      DATA_SOURCE_SERVER: postgres:5432
      DATA_SOURCE_DBNAME: kubernal_idp
      DATA_SOURCE_SSLMODE: disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kubernal-net

volumes:
  postgres-data:

networks:
  kubernal-net:
    name: kubernal-network
    driver: bridge
