services:
  postgres:
    image: postgres:16-alpine
    container_name: kubernal-postgres
    environment:
      POSTGRES_USER: kubernal
      POSTGRES_PASSWORD: kubernal_dev
      POSTGRES_DB: kubernal_idp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kubernal -d kubernal_idp']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubernal-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kubernal-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kubernal.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kubernal-net
    profiles:
      - ui

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: kubernal-pg-exporter
    environment:
      DATA_SOURCE_USER: kubernal
      DATA_SOURCE_PASS: kubernal_dev
      DATA_SOURCE_SERVER: postgres:5432
      DATA_SOURCE_DBNAME: kubernal_idp
      DATA_SOURCE_SSLMODE: disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kubernal-net

volumes:
  postgres-data:
  pgadmin-data:

networks:
  kubernal-net:
    name: kubernal-network
    driver: bridge
