kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubernal

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30081
        protocol: TCP

networking:
  podSubnet: '10.244.0.0/16'
  serviceSubnet: '10.96.0.0/12'
