apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  labels:
    app: backstage
    kubernal.io/managed-by: kubernal
data:
  app-config.yaml: |
    app:
      title: Kubernal IDP
      baseUrl: http://backstage.kubernal.local
    organization:
      name: Kubernal
    backend:
      baseUrl: http://backstage.kubernal.local
      listen: ':7007'
      cors:
        origin: http://backstage.kubernal.local
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: postgres-service
          port: 5432
          user: kubernal
          password: ${POSTGRES_PASSWORD}
          database: kubernal_backstage
    auth:
      providers:
        guest: {}
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Group, User]
      locations:
        - type: file
          target: /app/catalog-info.yaml
        - type: file
          name: kubernal-templates
          target: /app/templates/all.yaml
          rules:
            - allow: [Template]
    proxy:
      endpoints:
        "/kubernal/api":
          target: http://kubernal-api:4000/api/v1
          changeOrigin: true
    permission:
      enabled: true

  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: kubernal-idp
      description: Internal Developer Platform – Self-service application platform
      tags:
        - idp
        - platform
        - kubernetes
      links:
        - url: https://github.com/Gowaru/kubernal
          title: GitHub Repository
        - url: http://kubernal-api:4000/api/v1/health
          title: API Health
    spec:
      owner: platform-team
      domain: platform
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: kubernal-api
      description: Kubernal IDP Orchestrator API – Express + Prisma + PostgreSQL
      tags:
        - api
        - nodejs
        - express
        - prisma
        - postgresql
      annotations:
        github.com/project-slug: Gowaru/kubernal
        backstage.io/techdocs-ref: dir:.
    spec:
      type: service
      lifecycle: production
      owner: platform-team
      system: kubernal-idp
      providesApis:
        - kubernal-api
      dependsOn:
        - resource:kubernal-database
        - resource:kubernal-cluster
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: kubernal-backstage
      description: Kubernal IDP Developer Portal – Backstage frontend
      tags:
        - backstage
        - portal
        - react
      annotations:
        github.com/project-slug: Gowaru/kubernal
    spec:
      type: website
      lifecycle: production
      owner: platform-team
      system: kubernal-idp
    ---
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: kubernal-api
      description: Kubernal IDP REST API – Full OpenAPI 3.1 specification
      tags:
        - rest
        - api
        - openapi
        - express
    spec:
      type: openapi
      lifecycle: production
      owner: platform-team
      system: kubernal-idp
      definition:
        $text: http://kubernal-api:4000/api/v1/docs.json
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: kubernal-database
      description: PostgreSQL database for Kubernal IDP
      tags:
        - postgresql
        - database
    spec:
      type: database
      owner: platform-team
      system: kubernal-idp
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: kubernal-cluster
      description: Kubernetes cluster hosting the IDP platform
      tags:
        - kubernetes
        - cluster
        - kind
    spec:
      type: kubernetes-cluster
      owner: platform-team
      system: kubernal-idp
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: platform-team
      description: Platform engineering team
      tags:
        - team
        - platform
    spec:
      type: team
      profile:
        displayName: Platform Team
        email: platform@kubernal.io
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: admin
    spec:
      profile:
        displayName: Platform Admin
        email: admin@kubernal.io
      memberOf:
        - platform-team
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: developer-1
    spec:
      profile:
        displayName: Developer
        email: developer@kubernal.io
      memberOf:
        - platform-team
