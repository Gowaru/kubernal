apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernal-api
  labels:
    app: kubernal-api
    kubernal.io/managed-by: kubernal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernal-api
subjects:
  - kind: ServiceAccount
    name: kubernal-api
    namespace: kubernal-dev
  - kind: ServiceAccount
    name: kubernal-api
    namespace: kubernal-staging
  - kind: ServiceAccount
    name: kubernal-api
    namespace: kubernal-prod
