apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernal-staging
resources:
  - ../../base
  - sealed-api-secret.yaml
  - sealed-postgres-secret.yaml
configMapGenerator:
  - name: kubernal-api-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - CORS_ORIGIN=https://backstage-staging.kubernal.local
      - PORTAL_URL=https://portal-staging.kubernal.local
patches:
  - target:
      kind: Deployment
      name: kubernal-api
    patch: |-
      - op: add
        path: /metadata/labels/kubernal.io~1environment
        value: staging
      - op: add
        path: /spec/template/metadata/labels/kubernal.io~1environment
        value: staging
  - target:
      kind: Ingress
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kubernal-staging.local
