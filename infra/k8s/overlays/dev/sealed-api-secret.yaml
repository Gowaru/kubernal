---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: kubernal-api-secret
  namespace: kubernal-dev
spec:
  encryptedData:
    DATABASE_URL: 
    GITHUB_CLIENT_ID: 
    GITHUB_CLIENT_SECRET: 
    INTERNAL_API_KEY: 
    SESSION_SECRET: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      labels:
        app: kubernal-api
        kubernal.io/managed-by: kubernal
      name: kubernal-api-secret
      namespace: kubernal-dev
    type: Opaque
