apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernal-dev
resources:
  - ../../base
  - sealed-api-secret.yaml
  - sealed-postgres-secret.yaml
configMapGenerator:
  - name: kubernal-api-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
      - PORTAL_URL=http://localhost:3000
patches:
  - target:
      kind: Deployment
      name: kubernal-api
    patch: |-
      - op: add
        path: /metadata/labels/kubernal.io~1environment
        value: dev
      - op: add
        path: /spec/template/metadata/labels/kubernal.io~1environment
        value: dev
  - target:
      kind: Ingress
      name: kubernal-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kubernal-dev.local
