name: CI - Build & GitOps Sync

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/kubernal-api
  IMAGE_NAME_BACKSTAGE: ${{ github.repository_owner }}/kubernal-backstage

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubernal
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: kubernal_idp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp

      - run: npm test

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  # ─────────────────────────────────────────────────────────────
  # BUILD & PUSH (sur push develop/main uniquement)
  # ─────────────────────────────────────────────────────────────
  build-api:
    name: Build & Push API
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [lint-typecheck, test, format]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backstage:
    name: Build & Push Backstage
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [lint-typecheck, test, format]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKSTAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Backstage image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: apps/backstage
          file: apps/backstage/packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # GITOPS SYNC – Kustomize overlay update
  # ─────────────────────────────────────────────────────────────
  gitops-sync:
    name: GitOps Sync – Kustomize overlay
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [build-api, build-backstage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Determine overlays to update
        id: overlays
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "targets=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "targets=staging prod" >> $GITHUB_OUTPUT
          fi

      - name: Update overlay images with SHA tag
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          TAG="sha-${SHA7}"

          for overlay in ${{ steps.overlays.outputs.targets }}; do
            echo "Updating overlay: infra/overlays/$overlay"
            kustomize edit set image \
              ghcr.io/gowaru/kubernal-api:${TAG} \
              ghcr.io/gowaru/kubernal-backstage:${TAG} \
              --kustomize-dir infra/overlays/$overlay
          done

          echo "Updated images to tag: ${TAG}"

      - name: Commit and push overlay changes
        run: |
          if ! git diff --quiet infra/overlays/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add infra/overlays/
            git commit -m "chore(gitops): update overlay images to sha-${GITHUB_SHA:0:7}"
            git push
            echo "Overlay images updated and pushed"
          else
            echo "No changes to overlays"
          fi
