name: CI - Build & GitOps Sync

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/trufflehog-scan.yml'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/trufflehog-scan.yml'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/kubernal-api
  IMAGE_NAME_BACKSTAGE: ${{ github.repository_owner }}/kubernal-backstage

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubernal
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: kubernal_idp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - run: npm test

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubernal
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: kubernal_idp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp

      - name: Migrate DB
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp

      - name: Seed DB
        run: npm run prisma:seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp
          SESSION_SECRET: ci-e2e-session-secret-must-be-at-least-32-chars

      - name: Start API
        run: |
          nohup npm --workspace apps/api run dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null 2>&1; then
              echo "API ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4000/health || (cat /tmp/api.log && exit 1)
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp
          SESSION_SECRET: ci-e2e-session-secret-must-be-at-least-32-chars
          PORT: '4000'
          CORS_ORIGIN: http://localhost:3000
          LOG_LEVEL: silent

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/portal

      - name: Run E2E (API — real backend)
        run: npx playwright test --grep "real backend" --reporter=list
        working-directory: apps/portal
        env:
          API_URL: http://localhost:4000
          CI: 'true'

      - name: Build portal
        run: npm run build
        working-directory: apps/portal

      - name: Run E2E (portal — mocked)
        run: npx playwright test --grep -v "real backend" --reporter=list
        working-directory: apps/portal
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/portal/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/portal/test-results
          retention-days: 7

  build-api:
    name: Build & Push API
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [lint-typecheck, test, format]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy results to GitHub Security tab
        if: always() && steps.trivy.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitops-sync:
    name: GitOps Sync – Kustomize overlay
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [build-api]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine overlays to update
        id: overlays
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "targets=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "targets=staging prod" >> $GITHUB_OUTPUT
          fi

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update overlay images with SHA tag
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          TAG="sha-${SHA7}"

          for overlay in ${{ steps.overlays.outputs.targets }}; do
            KFILE="infra/overlays/$overlay/kustomization.yaml"
            echo "Updating $KFILE → tag: ${TAG}"
            yq eval '(.images[] | select(.name == "ghcr.io/gowaru/kubernal-api")).newTag = "'"${TAG}"'"' -i "$KFILE"
          done

          echo "Updated images to tag: ${TAG}"

      - name: Commit and push overlay changes
        run: |
          if ! git diff --quiet infra/overlays/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add infra/overlays/
            git stash
            git pull --rebase origin ${{ github.ref_name }}
            git stash pop
            git commit -m "chore(gitops): update overlay images to sha-${GITHUB_SHA:0:7}"
            git push
            echo "Overlay images updated and pushed"
          else
            echo "No changes to overlays"
          fi
