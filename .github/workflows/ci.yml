name: CI - Build, Scan, Sign & Deploy API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/kubernal-api
  K8S_MANIFEST_PATH: infra/kubernetes/api/deployment.yaml
  GITOPS_MODE: manifest-update

jobs:
  # ───────────────────────────
  # QUALITY GATES
  # ───────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubernal
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: kubernal_idp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kubernal:ci_test@localhost:5432/kubernal_idp

      - run: npm test

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  # ─────────────────────────────────────────────────────────────
  # BUILD + SCAN + SIGN + GITOPS
  # ─────────────────────────────────────────────────────────────
  build-scan-sign-deploy:
    name: Build, Scan, Sign & GitOps Sync
    if: github.ref == 'refs/heads/main'
    needs: [lint-typecheck, test, format]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # pour pusher les manifests (mode manifest-update)
      packages: write      # pour pusher l'image sur GHCR
      security-events: write  # pour uploader les résultats Trivy
      id-token: write      # pour Cosign keyless signing (optionnel)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour git push avec historique

      # Login GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata pour les tags
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build & Push
      - name: Build and push API image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan avec Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Signature avec Cosign (mode keyless avec GitHub OIDC)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITOPS SYNC : Mise à jour directe du manifest
      - name: Update K8s manifest with new image digest
        if: env.GITOPS_MODE == 'manifest-update'
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ steps.build-push.outputs.digest }}"
          echo "Updating manifest to: $NEW_IMAGE"

          # Installation de yq pour manipuler le YAML
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          # Mise à jour du manifest
          yq eval -i ".spec.template.spec.containers[0].image = \"$NEW_IMAGE\"" ${{ env.K8S_MANIFEST_PATH }}

          # Commit & push si changements
          if ! git diff --quiet ${{ env.K8S_MANIFEST_PATH }}; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ${{ env.K8S_MANIFEST_PATH }}
            git commit -m "chore(gitops): update API image to ${{ steps.build-push.outputs.digest }}"
            git push
            echo "Manifest updated and pushed"
          else
            echo "No changes to manifest"
          fi

      # Notification
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | \`${{ steps.build-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Trivy | [Voir résultats](/${{ github.repository }}/security/code-scanning) |" >> $GITHUB_STEP_SUMMARY
          echo "| Signature Cosign | Keyless OIDC |" >> $GITHUB_STEP_SUMMARY
          echo "| GitOps Sync | Mode: \`${{ env.GITOPS_MODE }}\` |" >> $GITHUB_STEP_SUMMARY
